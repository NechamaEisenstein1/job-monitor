# Local production-like stack: PostgreSQL + API/dashboard.
#   docker compose up --build            -> http://localhost:8000
#   docker compose run --rm app python -m backend.cli run
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_monitor
      POSTGRES_USER: job_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_monitor"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://job_monitor:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/job_monitor
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
