    note: "כשהאתר חוסם את הסריקה (Cloudflare), המשרות נאספות מדפי החברה בג'ובנט."
    fallback:
      type: jobnet
      pages: ["20969", "12429"]

  - name: "SQLink"
    type: site
    site: sqlink

  - name: "One"
