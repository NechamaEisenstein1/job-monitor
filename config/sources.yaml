# Live recruitment sources. `name` is the recruitment company recorded on every job
# and must match the site scraper's company (see backend/infrastructure/scrapers/sites/).
#
# Types:
#   site      - a per-site scraper module (`site:` key below)
#   drushim   - the company's page(s) on drushim.co.il (`pages`: the "<id>-<slug>" part of
#               https://www.drushim.co.il/דרושים-<id>-<slug>/)
#   jobnet    - the company's page(s) on jobnet.co.il (`pages`: companyID values)
#   json_api  - GET a JSON endpoint, map fields with `field_map` (no code needed)
#   fixture   - local JSON file (tests / offline demos only)
#
# All paths used were checked against each site's robots.txt (2026-09).
# Set `enabled: false` to pause a source; `note` is shown on the Sources page.
# A `site` source may name a `fallback` board (type + pages): when the company's own site
# refuses the request (e.g. Cloudflare's bot check from GitHub's servers), the same company
# is collected from that board instead.
sources:
  - name: "Matrix"
    type: site
    site: matrix

  - name: "HMS"
    type: site
    site: hms

  - name: "Tigbur"
    type: site
    site: tigbur
    # Tigbur is a general staffing firm; collect only its technology/engineering categories
    # (the title classifier then drops any non-tech job that slips through).
    categories:
      - "הנדסת תוכנה /מחשבים"
      - "תשתיות IT"
      - "מע` מידע"
      - "מחשבים"
      - "אבטחת איכות"
      - "אינטרנט"
      - "תקשורת"
      - "בכירים טכנולוגי"
      - "טכנאות"
      - "מהנדסים"
      - "הנדסאים"
      - "הנדסה"
      - "אלקטרוניקה"
      - "הנדסת אלקטרוניקה"
      - "סטודנטים"
      - "אוניברסיטה/טכניון"

  - name: "Aman"
    type: site
    site: aman
    note: "כשהאתר חוסם את הסריקה (Cloudflare), המשרות נאספות מדף החברה בדרושים."
    fallback:
      type: drushim
      pages: ["23333-קבוצת-אמן"]

  - name: "Horizon"
    type: site
    site: horizon

  - name: "Comblack"
    type: site
    site: comblack

  - name: "Consist"
    type: site
    site: consist

  - name: "Yael"
    type: site
    site: yael

  - name: "GAV Systems"
    type: site
    site: gav

  - name: "Ness"
    type: site
    site: ness

  - name: "ProLogic"
