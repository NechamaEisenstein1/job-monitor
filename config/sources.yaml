    note: "כשהאתר לא זמין, המשרות נאספות מדף החברה בדרושים."
    fallback:
      type: drushim
      pages: ["28853-יעל-תוכנה"]

  - name: "GAV Systems"
    type: site
    site: gav
    note: "כשהאתר חוסם את הסריקה, המשרות נאספות מדפי החברה בדרושים."
    fallback:
      type: drushim
      pages: ["4259385-gavsystems", "23190-גב-מערכות-צפון"]

  - name: "Ness"
