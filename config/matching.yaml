run_status:
  success_ratio: 0.9
  partial_ratio: 0.5

locations:
  primary:
    - "ירושלים"
    - "Jerusalem"

  secondary:
    - "מודיעין"
    - "בית שמש"

  # Sources such as SQLink and ProLogic publish no location field; for those jobs,
  # look for the configured locations in the title/description/requirements instead.
  search_text_when_missing: true

keywords:
  junior:
    strong_positive:
      - "ללא ניסיון"
      - "0-1 years"
      - "junior"

    medium_positive:
      - "עד שנתיים"
      - "entry level"
      - "בוגר"
      - "בוגרים"
      - "רמה א"
      - "דרג א"

    strong_negative:
      - "senior"
      - "lead"
      - "architect"
      - "principal"
      - "5+ years"
      - "4+ years"
      - "בכיר"
      - "ארכיטקט"
      - "ראש צוות"
      - "ר\"צ"
      - "ר”צ"
      - "ר״צ"
      - "ראש/ת צוות"
      - "ניהול צוות"
      - "מנוסה"
      - "מנוסה/ת"
      - "טים ליד"
      - "מוביל/ה טכנולוגי"
      - "מנהל/ת פיתוח"
      - "4 שנות ניסיון"
      - "5 שנות ניסיון"
      - "ארבע שנות ניסיון"
      - "חמש שנות ניסיון"

# Role classification - by TITLE only (descriptions mention "בדיקות"/"פיתוח" in passing
# far too often). "other" is an explicit exclusion list and wins outright (e.g.
# "מפתח/ת הדרכה" is a training role). Among the tech types, the role word that appears
# FIRST in the title decides ("מפתח/ת Fullstack ובודק/ת אוטומציה" -> software); ties go to the
# longer (more specific) phrase, then to the order below. A title that names no role is "other".
roles:
  types:
    other: ["הדרכה", "פיתוח עסקי", "business development", "פיתוח ארגוני", "מכירות", "sales", "שיווק",
            "marketing", "שירות לקוחות", "נציג/ת שירות", "נציג שירות", "customer service", "מזכיר",
            "אדמיניסטרציה", "אדמיניסטרטיבי", "פקיד", "רכש", "גיוס", "משאבי אנוש", "חשב/ת", "חשבות", "הנהלת חשבונות",
            "כספים", "נהג", "מחסן", "לוגיסטיקה", "קבלה", "אחזקה"]
    software: ["developer", "מפתח", "מפתחת", "מתכנת", "מתכנתת", "תוכניתן", "תכניתן", "programmer",
               "software", "תוכנה", "פיתוח", "full stack", "fullstack", "backend", "back end", "back-end",
               "frontend", "front end", "front-end", "java", "python", ".net", "c#", "node", "react", "angular",
               "android", "ios", "cobol", "mainframe", "mf", "architect", "ארכיטקט", "rpa", "low-code", "outsystems", "salesforce developer"]
    data: ["data", "דאטה", "נתונים", "bi", "dba", "big data", "machine learning", "ml", "ai", "בינה מלאכותית",
           "data scientist", "מדען/ית נתונים", "אנליסט", "analyst", "sql", "nosql"]
    devops: ["devops", "דבופס", "sre", "cloud", "ענן", "kubernetes", "platform engineer"]
    cyber: ["סייבר", "cyber", "cybersecurity", "אבטחת מידע", "security", "soc", "siem", "הגנת", "threat", "מודיעין סייבר"]
    qa: ["מפתח/ת אוטומציה", "מפתח אוטומציה", "automation developer", "automation engineer", "qa", "בודק", "בודקת", "בדיקות", "tester", "test engineer", "אוטומציה", "automation", "validation", "ולידציה"]
    embedded: ["embedded", "אמבדד", "firmware", "קושחה", "real-time", "real time", "rt/embedded", "bsp"]
    hardware: ["hardware", "חומרה", "chip", "chips", "שבבים", "שבב", "asic", "fpga", "vlsi", "rf", "אלקטרוניקה",
               "verification", "אימות", "בורד", "board", "אלקטרו-אופטי", "אלקטרואופטי"]
    product: ["מנהל/ת מוצר", "מנהל מוצר", "product manager", "product owner", "מוצר", "project manager",
              "ניהול פרויקט", "פרויקט", "project", "מנהל/ת פרויקט", 'מנהל\ת פרויקט', "מנהל פרויקט", "פרויקטים", "pmo", "scrum",
              "ux", "ui", "חוויית משתמש", "אפיון", "טרנספורמציה דיגיטלית", "דיגיטל"]
    it: ["system", "סיסטם", "it", "helpdesk", "help desk", "הלפדסק", "תמיכה טכנית", "תמיכה אפליקטיבית",
         "טכנאי", "מחשוב", "תשתיות", "רשתות", "network", "תקשורת", "pc", "מיישם", "מיישמ", "יישום", "sap",
         "erp", "crm", "priority", "פריוריטי", "מערכות מידע", "מנתח/ת מערכות", "מנתח מערכות", "ניתוח מערכות",
         "system analyst", "אינטגרציה", "integration", "servicenow", "sharepoint", "dynamics",
         "תמיכה", "תומכ", "support", "hd", "הטמעה", "הטמעת", "מהנדס/ת מערכת", "מהנדס מערכת",
         "system engineer", "שילובים", "operations", "תומך", "רשת", "מטמיע", "מתחזק/ת אתרים", "ממוחשב", "google workspace"]
  # Generic types: chosen only when no specific type matches ("מיישם/ת הגנת סייבר" -> cyber).
  fallback_types: ["it"]
  # Every tech type can be eligible; "other" (non-tech) is stored but never shown by default.
  eligible_types: ["software", "data", "devops", "cyber", "qa", "embedded", "hardware", "product", "it"]

# Postings for government bodies / public tenders get a badge and priority in alerts.
government:
  keywords: ["מכרז", "משרד ממשלתי", "משרד ממשלה", "משרדי ממשלה", "ארגון ממשלתי", "גוף ממשלתי",
             "רשות ממשלתית", "למשרד ממשלתי", "government", "ministry"]

# Relevance order (the default Jobs sort): junior roles first, then by role type, then score.
ranking:
  junior_bonus: 1000
  role_priority: ["software", "data", "devops", "cyber", "qa", "embedded", "hardware", "product", "it", "other"]
  role_step: 100

# How keyword hits turn into junior_score (clamped to 0..1).
# Each keyword counts once, no matter how many times it appears.
junior_scoring:
  base: 0.5
  strong_positive: 0.3
  medium_positive: 0.15
  strong_negative: -0.5

# Required years of experience are read from each posting ("3 שנות ניסיון", "עד שנה",
# "ללא ניסיון", "3+ years" ...; lines marked "יתרון" are ignored). This decides junior
# before any keyword does: > junior_max_years is never junior, <= is always junior
# (unless a senior/lead keyword is present). Postings that state nothing fall back to
# the keyword score below.
experience:
  junior_max_years: 2

thresholds:
  junior_score: 0.6
  match_title_fuzzy: 0.8

# Daily refresh: every run keeps only the jobs the sites still publish. Postings a site
# no longer lists are deleted (with their history) - but only for sites that scraped
# successfully in this run, and never more than this share of a site in one run
# (a bigger drop is far likelier a broken scraper; the run page then shows a warning).
retention:
  max_prune_ratio: 0.5

schedule:
  # The scheduled date of a run is the calendar date in this timezone.
  timezone: "Asia/Jerusalem"

email:
  recipient: "${RECIPIENT_EMAIL}"
  subject: "משרות חדשות - {date}"
  notification_type: "daily_digest"
  # A claim left in "pending" longer than this (crashed sender) may be taken over.
  claim_timeout_minutes: 30

# Per-user alerts and recruiter outreach (the multi-user personal area).
users:
  alert_subject: "משרות שמתאימות לך - {date}"
  # Hard cap on personalised recruiter emails a user can send per day (anti-abuse).
  outreach_daily_limit: 30
  session_days: 14
  # Comma-separated addresses that become admins once the address is VERIFIED
  # (Google sign-in, the verification link, or an admin-created account). Set it in
  # .env - never commit real addresses (the repository is public).
  admin_emails: "${ADMIN_EMAILS}"

scraper:
  timeout_seconds: 30
  max_retries: 3
  retry_backoff_seconds: 1.0
  rate_limit_per_site: 2.0
  max_concurrent_workers: 4
